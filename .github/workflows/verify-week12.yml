name: Verify Week12 Docker
on:
  push:
    branches: [verify-week12-docker]
    paths: ['.github/workflows/verify-week12.yml']
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Build and verify assignment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Week12/src/greet_docker
          mkdir -p "Week12/"
          printf '%s' '' | base64 -d > 'Week12/Dockerfile'
          mkdir -p "Week12/src/greet_docker"
          printf '%s' '' | base64 -d > 'Week12/src/greet_docker/__init__.py'
          mkdir -p "Week12/"
          printf '%s' '' | base64 -d > 'Week12/uv.lock'
          mkdir -p "Week12/"
          printf '%s' 'LnZlbnYKX19weWNhY2hlX18K' | base64 -d > 'Week12/.dockerignore'
          mkdir -p "Week12/"
          printf '%s' '' | base64 -d > 'Week12/pyproject.toml'
          cd Week12
          docker run --rm hello-world
          docker build --progress=plain -t greet-docker . > /tmp/week12-build.log 2>&1 || { cat /tmp/week12-build.log; exit 1; }
          docker image ls greet-docker > /tmp/week12-images.log
          docker run --rm greet-docker > /tmp/week12-default.log
          docker run --rm greet-docker greet-docker Hee > /tmp/week12-hee.log
          test "$(cat /tmp/week12-default.log)" = 'Hello, Docker!'
          test "$(cat /tmp/week12-hee.log)" = 'Hello, Hee!'
          {
          printf '# greet-docker Docker 실행\n\n## 실행 방법\nWeek12 폴더에서 실행한다.\n\x60\x60\x60text\ndocker build -t greet-docker .\ndocker run --rm greet-docker\n\x60\x60\x60\n\n## 실행 기록\nGitHub Actions Ubuntu runner에서 실제 실행했다. 빌드 로그는 마지막 20줄을 발췌했다.\n\x60\x60\x60text\n$ docker build -t greet-docker .\n'
          tail -n 20 /tmp/week12-build.log
          printf '$ docker image ls greet-docker\n'
          cat /tmp/week12-images.log
          printf '$ docker run --rm greet-docker\n'
          cat /tmp/week12-default.log
          printf '$ docker run --rm greet-docker greet-docker Hee\n'
          cat /tmp/week12-hee.log
          printf '\x60\x60\x60\n'
          } > docker_build.md
          cat docker_build.md
          
      - uses: actions/upload-artifact@v4
        with:
          name: week12-docker-evidence
          path: Week12/docker_build.md
